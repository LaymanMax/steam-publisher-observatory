name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          check-latest: true
          cache-dependency-path: "backend/go.sum"

      - name: Verify Go format (gofmt)
        run: |
          diffs=$(gofmt -s -d backend/)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go code detected:"
            echo "$diffs"
            exit 1
          fi

      - name: Run Go vet
        run: |
          cd backend
          go vet ./...

      - name: Run Go tests
        run: |
          cd backend
          go test -v ./...

      - name: Build server binary
        run: |
          cd backend
          go build -v -o bin/server cmd/server/main.go

      - name: Build ingest CLI binary
        run: |
          cd backend
          go build -v -o bin/ingest cmd/ingest/main.go

  frontend:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest unit tests
        run: |
          cd frontend
          pnpm test

      - name: Type check and build production bundle
        run: |
          cd frontend
          pnpm build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  full-stack-smoke:
    name: Full Stack Smoke Test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          check-latest: true
          cache-dependency-path: "backend/go.sum"

      - name: Download frontend dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build unified Go server
        run: |
          cd backend
          go build -o bin/server cmd/server/main.go

      - name: Start server & verify endpoints
        run: |
          ./backend/bin/server -port 8080 -db /tmp/observatory_ci.duckdb &
          SERVER_PID=$!
          sleep 2

          echo "Checking health endpoint..."
          curl -f http://127.0.0.1:8080/api/health

          echo "Checking SPA index delivery..."
          curl -f http://127.0.0.1:8080/ | grep -q "Steam Publisher Observatory"

          echo "Checking dataset status endpoint..."
          curl -f http://127.0.0.1:8080/api/dataset/status

          kill $SERVER_PID
